<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F6F2;--surface:#FFFFFF;--surface2:#FAFAFA;--text:#1A1F2B;--muted:#4A5568;--line:#E8E4DE;
  --ink:#28293A;--steel:#365A72;--teal:#4F7D73;--sand:#D3B792;--coral:#D67B68;
  --head:#28293A;--headText:#F8F6F2;--btn:#28293A;--btnText:#F8F6F2;
  --tealTint:rgba(79,125,115,.10);--coralTint:rgba(214,123,104,.10);--sandTint:rgba(211,183,146,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F2B;--surface:#232536;--surface2:#282A3C;--text:#F1EEE8;--muted:#A9B1C0;--line:#363950;
    --head:#14171F;--steel:#7FA3BC;--teal:#86B3A8;--btn:#F1EEE8;--btnText:#1A1F2B;
    --tealTint:rgba(134,179,168,.14);--coralTint:rgba(214,123,104,.16);--sandTint:rgba(211,183,146,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F2B;--surface:#232536;--surface2:#282A3C;--text:#F1EEE8;--muted:#A9B1C0;--line:#363950;
  --head:#14171F;--steel:#7FA3BC;--teal:#86B3A8;--btn:#F1EEE8;--btnText:#1A1F2B;
  --tealTint:rgba(134,179,168,.14);--coralTint:rgba(214,123,104,.16);--sandTint:rgba(211,183,146,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,"Noto Sans KR","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,.card:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.top{background:var(--head);color:var(--headText)}
.top-in{max-width:1320px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px;color:var(--sand)}
.brand small{font-weight:500;font-size:13px;opacity:.7;margin-left:6px}
.spacer{flex:1}
.score{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
.score b{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--sand)}
.seg{display:flex;border:1px solid rgba(248,246,242,.25);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--headText);opacity:.7}
.seg button.on{background:var(--headText);color:var(--head);opacity:1}

.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 32px;display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
.nav-item{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.nav-item:hover{background:var(--surface)}
.nav-item.on{background:var(--surface);border-color:var(--line)}
.nav-num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);width:20px}
.nav-t{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.nav-s{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--teal);display:flex;align-items:center;gap:4px}
.nav-s svg{width:14px;height:14px}
.nav-res{margin-top:8px;border-top:1px solid var(--line);padding-top:12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;min-width:0}
.ch-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.ch-head .num{font-family:"JetBrains Mono",monospace;font-size:44px;font-weight:600;line-height:.9;color:var(--sand)}
.ch-head h2{margin:0;font-size:24px;letter-spacing:-.015em;line-height:1.2}
.ch-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.tab.on{background:var(--btn);color:var(--btnText);border-color:var(--btn)}

.story{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px}
.cast{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.cast-p{display:flex;align-items:center;gap:9px}
.cast-p .av{width:46px;height:46px}
.cast-p b{display:block;font-size:14px;line-height:1.2}
.cast-p span{font-size:12.5px;color:var(--c);font-weight:600}
.chatbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:260px}
.chat{display:flex;flex-direction:column;gap:12px}
.av{border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c)}
.av svg{width:100%;height:100%;display:block;border-radius:50%}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:86%}
.msg .av{width:44px;height:44px}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 14px 10px;max-width:60ch}
.msg.r .bub{background:var(--tealTint);border-color:transparent;border-radius:16px 16px 4px 16px}
.who{font-size:12px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:baseline;margin-bottom:1px}
.who span{font-weight:500;color:var(--muted)}
.msg.r .who{justify-content:flex-end}
.sys{align-self:center;display:flex;gap:8px;align-items:flex-start;max-width:92%;background:var(--sandTint);border-radius:12px;padding:8px 14px;color:var(--muted);font-size:14px}
.sys svg{margin-top:2px;width:16px;height:16px;color:var(--sand)}
.new.l{animation:inL .35s ease both}.new.r{animation:inR .35s ease both}.sys.new{animation:inU .35s ease both}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ctrl{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btnText);border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.coral{background:var(--coral);color:#fff}
.side{display:flex;flex-direction:column;gap:14px}
.key{border-left:3px solid var(--coral);background:var(--coralTint);border-radius:0 12px 12px 0;padding:12px 16px}
.key h4{margin:0 0 4px;font-size:13px;color:var(--coral)}
.key p{margin:0;font-size:14.5px}
.diagram{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface2);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:520px;height:auto}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);font-size:13.5px}
.cmp b{display:block;font-size:14px;margin-bottom:2px}
.cmp .src{color:var(--teal);font-weight:600}
.cmp .eg{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface2);text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--steel)}
.card-top{display:flex;align-items:baseline;gap:8px}
.card-top b{font-size:15.5px}
.card-top span{color:var(--muted);font-size:13px}
.pips{margin-left:auto;display:flex;gap:4px;align-self:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.card.s1 .pips i:first-child,.card.s2 .pips i{background:var(--teal);border-color:var(--teal)}
.card p{margin:0;font-size:14px;display:none}
.card.s1 p,.card.s2 p{display:block}
.when{display:none;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13.5px}
.card.s2 .when{display:block}
.card.s1,.card.s2{border-color:var(--teal)}
.when em{font-style:normal;font-weight:700;color:var(--teal);display:block;font-size:12.5px;margin-bottom:2px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
details.law{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--sandTint)}
details.law summary{cursor:pointer;padding:11px 16px;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.law summary::-webkit-details-marker{display:none}
details.law summary svg{margin-left:auto;transition:transform .2s}
details.law[open] summary svg{transform:rotate(180deg)}
.tbl{overflow-x:auto;padding:0 16px 14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border-radius:10px;overflow:hidden}
.tbl th{text-align:left;font-weight:700;font-size:12.5px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{white-space:nowrap}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--c);color:var(--c)}

.quiz{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dot{width:26px;height:6px;border-radius:3px;background:var(--line);border:0;padding:0}
button.dot{cursor:pointer}button.dot:hover{outline:2px solid var(--line);outline-offset:2px}
.dot.ok{background:var(--teal)}.dot.no{background:var(--coral)}.dot.cur{background:var(--steel)}
.q{font-size:18px;font-weight:700;margin:0 0 14px;line-height:1.45;max-width:70ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;text-align:left;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none;margin-top:1px}
.opt:hover:not([disabled]){border-color:var(--steel)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--teal);background:var(--tealTint)}
.opt.wrong{border-color:var(--coral);background:var(--coralTint)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:14.5px}
.fb.ok{background:var(--tealTint);border-left:3px solid var(--teal)}
.fb.no{background:var(--coralTint);border-left:3px solid var(--coral)}
.fb b{display:block;margin-bottom:2px}
.qside{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface2);font-size:13.5px;color:var(--muted);align-self:start}
.qside .big{font-family:"JetBrains Mono",monospace;font-size:30px;color:var(--text);font-weight:600}
.done{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.done .big{font-family:"JetBrains Mono",monospace;font-size:56px;font-weight:600;color:var(--sand);line-height:1}
.done p{margin:4px 0 0;max-width:52ch}

.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;font-size:14px}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--sand);border-radius:4px}
.bar .mono{text-align:right;font-size:13px;color:var(--muted)}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav-item{width:auto;flex:none}
  .nav-res{margin:0;border:0;padding:0}
  .story,.quiz,.res{grid-template-columns:1fr}
  .tabs{margin-left:0;width:100%}
}
@media (max-width:640px){
  .top-in{flex-wrap:wrap;padding:12px 16px}
  .brand small{display:none}
  .wrap{padding:14px 12px 24px}
  .panel{padding:16px}
  .opts{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .ch-head .num{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

    {t:"Certainty of subject matter",k:"대상재산의 확실성",d:{ko:"어떤 재산이 신탁재산인지, 각 수익자 몫이 얼마인지 분명해야 해요.",en:"It must be clear what property is held on trust and what share each beneficiary gets."},w:{ko:"와인이나 금 같은 물건은 보통 따로 분리돼 있어야 해요. 같은 회사의 동일한 주식은 분리하지 않아도 될 수 있어요.",en:"Goods like wine or gold usually must be separated out. Identical shares in one company may not need separating."}},
    {t:"Certainty of objects",k:"수익자의 확실성",d:{ko:"누가 수익자인지 분명해야 법원이 신탁을 집행할 수 있어요.",en:"It must be clear who the beneficiaries are, so the court can enforce the trust."},w:{ko:"고정신탁은 전체 명단 테스트(complete list test), 재량신탁은 해당 여부 테스트(is-or-is-not test)를 적용해요.",en:"A fixed trust uses the complete list test. A discretionary trust uses the is-or-is-not test."}},
    {t:"Fixed trust",k:"고정신탁",d:{ko:"각 수익자의 몫이 신탁 조건으로 정해져 있어요. 예를 들어 절반씩처럼요.",en:"Each beneficiary's share is set by the trust terms, for example half each."},w:{ko:"설정자가 몫을 확정해 두고 싶을 때 써요.",en:"When the settlor wants shares locked in from the start."}},
    {t:"Discretionary trust",k:"재량신탁",d:{ko:"수탁자가 정해진 범위(class) 안에서 누구에게 수익이나 원본을 얼마나 줄지 결정해요.",en:"The trustee decides which beneficiaries within a class receive income or capital, and how much."},w:{ko:"호주 가족신탁(family trust)에서 매우 흔해요. 유연성과 세금 계획 목적으로 많이 써요.",en:"Very common for Australian family trusts, often for flexibility and tax planning."}},
    {t:"Constitution",k:"신탁의 구성",d:{ko:"재산이 실제로 수탁자에게 넘어가야(vest) 신탁이 생겨요. 형평법은 설정자가 끝내지 않은 증여를 대신 완성해 주지 않아요.",en:"The trust exists only once the property vests in the trustee. Equity won't finish a gift the settlor left incomplete."},w:{ko:"설정자가 자신이 해야 할 일을 모두 마쳤다면, 등록 전이라도 형평법은 증여가 완성된 것으로 봐요.",en:"If the settlor has done everything they personally had to do, equity treats the gift as complete even before registration."}}
  ],
  law:[
    ["Knight v Knight (1840) 3 Beav 148",{ko:"세 가지 확실성",en:"The three certainties"}],
    ["Byrnes v Kendle (2011) 243 CLR 253",{ko:"의도는 객관적으로 판단",en:"Intention is assessed objectively"}],
    ["Korda v Australian Executor Trustees (SA) Ltd (2015) 255 CLR 62",{ko:"상업 거래에서의 신탁 의도",en:"Intention to create a trust in commercial dealings"}],
    ["Re London Wine Co (Shippers) Ltd [1986] PCC 121",{ko:"분리되지 않은 물건은 대상 불확실",en:"Unseparated goods fail for uncertainty"}],
    ["White v Shortall (2006) 68 NSWLR 650",{ko:"동일 주식의 일부에 대한 신탁 유효",en:"Trust over part of a holding of identical shares"}],
    ["McPhail v Doulton [1971] AC 424",{ko:"재량신탁의 is-or-is-not 테스트",en:"Is-or-is-not test for discretionary trusts"}],
    ["Milroy v Lord (1862) 4 De GF & J 264",{ko:"형평법은 불완전한 증여를 완성하지 않음",en:"Equity won't perfect an imperfect gift"}],
    ["Corin v Patton (1990) 169 CLR 540",{ko:"설정자가 할 일을 다 했으면 형평법상 완성",en:"Gift complete in equity once settlor has done all required"}]
  ],
  quiz:[
    {q:{ko:"유언장에 “아내에게 집을 준다. 아내가 아이들을 잘 돌볼 것이라 굳게 믿는다.”라고 적혀 있어요. 아이들을 위한 신탁일까요?",en:"A will says “I give my house to my wife, in full confidence that she will look after our children.” Is there a trust for the children?"},o:[{ko:"네, 아이들이 언급됐으니까요",en:"Yes, the children are mentioned"},{ko:"아마 아니에요. 바람을 표현한 권고적 문언이에요",en:"Probably not. These are precatory words expressing hope"},{ko:"네, 유언장에 있으니까요",en:"Yes, because it's in a will"},{ko:"아내가 동의할 때만 신탁이에요",en:"Only if the wife agrees"}],a:1,y:{ko:"‘굳게 믿는다’는 바람의 표현이에요. 구속력 있는 의무를 부과하려는 객관적 의도가 없으면 아내가 집을 온전히 가져요.",en:"“In full confidence” expresses hope. Without an objective intention to impose a binding obligation, the wife takes the house outright."}},
    {q:{ko:"배리 아저씨가 “지하 창고 와인 100병 중 20병”을 신탁한다고 선언했지만 따로 분리하지 않았어요. 어떤 확실성이 부족할까요?",en:"Barry declares a trust over “20 of the 100 bottles of wine in my cellar” but never separates them. Which certainty fails?"},o:[{ko:"의도",en:"Intention"},{ko:"대상재산",en:"Subject matter"},{ko:"수익자",en:"Objects"},{ko:"부족한 것 없음",en:"None of them"}],a:1,y:{ko:"와인은 병마다 다를 수 있어서, 20병을 분리하지 않으면 어느 병이 신탁재산인지 알 수 없어요.",en:"Bottles of wine can differ, so without separating the 20 no one can tell which ones are trust property."}},
    {q:{ko:"재량신탁의 수익자 범위가 “내 직원과 그 친척”이에요. 법원은 어떤 테스트를 쓸까요?",en:"A discretionary trust is for “any of my employees and their relatives”. Which test applies to the objects?"},o:[{ko:"전체 명단 테스트",en:"Complete list test"},{ko:"해당 여부(is-or-is-not) 테스트",en:"Is-or-is-not test"},{ko:"과반수 테스트",en:"Majority test"},{ko:"테스트가 필요 없어요",en:"No test is needed"}],a:1,y:{ko:"재량신탁에서는 어떤 사람이 범위 안에 있는지 없는지만 판단할 수 있으면 충분해요. 전체 명단이 필요하지 않아요.",en:"For a discretionary trust it's enough that you can say of any given person whether they are or are not in the class. You don't need a full list."}},
    {q:{ko:"로즈 할머니가 주식양도서에 서명하고 주권과 함께 데브 삼촌에게 줬어요. 회사가 데브 명의로 등록하기 전에 할머니가 돌아가셨어요. 신탁이 구성됐을까요?",en:"Rose signs a share transfer form and gives it with the share certificate to Dev. She dies before the company registers Dev. Is the trust constituted?"},o:[{ko:"아니요, 등록이 안 됐으니까요",en:"No, registration never happened"},{ko:"형평법상 네, 할머니가 할 일을 모두 마쳤으니까요",en:"Yes in equity, she had done everything she needed to"},{ko:"유언장에 적혀 있을 때만요",en:"Only if her will says so"},{ko:"아니요, 데브가 대금을 내야 해요",en:"No, Dev must pay for the shares"}],a:1,y:{ko:"Corin v Patton에 따르면, 설정자가 자기 몫의 일을 모두 마쳤고 양수인이 설정자 없이도 이전을 완료할 수 있다면 형평법상 증여가 완성돼요.",en:"Under Corin v Patton, once the settlor has done all that is necessary on their part and the transferee can complete it without them, the gift is complete in equity."}}
  ]
},
{
  icon:"shield",
  title:{ko:"수탁자의 의무",en:"Dev's rulebook"},
  sub:{ko:"의무, 권한, 그리고 수탁자의 권리",en:"Duties, powers and the trustee's own rights"},
  story:[
    {w:"narr",ko:"데브 삼촌이 수탁자가 된 지 몇 년이 지났어요. 신탁재산이 늘어서 이제 작은 바닷가 아파트도 있어요. 삼촌에게 슬슬 이런저런 생각이 들어요.",en:"Dev has been trustee for a few years. The fund has grown and now includes a small beach unit. Dev is starting to get ideas."},
    {w:"dev",ko:"바닷가 아파트를 내가 사면 어때? 시세대로 낼게, 진짜로.",en:"What if I buy the beach unit myself? I'll pay market price, promise."},
    {w:"mia",ko:"삼촌이 삼촌한테 판다고요? 이해충돌 같은데요.",en:"You'd be selling to yourself? That sounds like a conflict."},
    {w:"dev",ko:"알았어. 그럼 전부 요즘 뜨는 코인 하나에 넣을게. 수익률 엄청나대!",en:"Fine. Then I'll put everything into one hot crypto coin. Huge returns!"},
    {w:"leo",ko:"그리고 우리 각자 얼마 받을지는 누가 정해요?",en:"And who decides how much each of us gets?"},
    {w:"dev",ko:"간단해. 동전 던져서 정하지 뭐.",en:"Easy. I'll flip a coin."},
    {w:"narr",ko:"나쁜 아이디어 세 개, 서로 다른 의무 세 개예요. 데브 삼촌이 어떤 규칙을 어기려는지 살펴봐요.",en:"Three bad ideas, three different duties. Let's see which rules Dev is about to break."}
  ],
  key:{ko:"수탁자는 신인의무자(fiduciary)예요. 핵심은 이해충돌 금지(no conflict)와 이익 취득 금지(no profit)예요. 여기에 신탁 조건 준수, 주의의무, 재량을 제대로 고려할 의무가 더해져요.",en:"A trustee is a fiduciary. The core rules are no conflict and no profit. On top of those sit the duties to follow the terms, take care, and properly consider any discretion."},
  cards:[
    {t:"Fiduciary duty",k:"신인의무",d:{ko:"충실의무예요. 수탁자는 자기 이익을 제쳐두고 수익자의 이익을 위해 행동해야 해요.",en:"A duty of loyalty. The trustee must act in the beneficiaries' interests and put their own aside."},w:{ko:"호주에서 신인의무는 금지적(proscriptive) 성격이에요. 무엇을 하라고 요구하기보다 무엇을 하지 말라고 정해요.",en:"In Australia fiduciary duties are proscriptive. They tell the trustee what not to do rather than imposing positive duties to act."}},
    {t:"No-conflict rule",k:"이해충돌 금지",d:{ko:"수탁자는 자기 이익과 의무가 충돌할 수 있는 위치에 서면 안 돼요. 신탁재산을 자기가 사는 자기거래(self-dealing)가 대표적이에요.",en:"The trustee must not be in a position where their interest may conflict with their duty. Buying trust property for themselves (self-dealing) is the classic example."},w:{ko:"가격이 공정했더라도 수익자는 자기거래를 취소할 수 있어요. 신탁증서, 수익자의 충분한 정보에 기초한 동의(informed consent), 법원 허가가 있으면 예외예요.",en:"Beneficiaries can set aside self-dealing even at a fair price, unless the trust deed, their informed consent or the court authorised it."}},
    {t:"No-profit rule",k:"이익 취득 금지",d:{ko:"수탁자는 그 지위를 이용해 허락받지 않은 이익을 얻으면 안 돼요. 신탁이 손해를 보지 않았더라도 마찬가지예요.",en:"The trustee must not make an unauthorised profit from their position, even if the trust loses nothing."},w:{ko:"그런 이익은 반환해야 하고(account of profits), 의제신탁(constructive trust)으로 보유된 것으로 볼 수 있어요.",en:"Any such profit must be handed over (account of profits) and may be held on constructive trust."}},
    {t:"Duty to follow the terms",k:"신탁 조건 준수 의무",d:{ko:"수탁자는 신탁증서 내용을 정확히 이행하고 올바른 사람에게 지급해야 해요.",en:"The trustee must carry out the trust deed exactly and pay the right people."},w:{ko:"정직한 실수로 엉뚱한 사람에게 지급해도 의무 위반이에요.",en:"Paying the wrong person is a breach even if it was an honest mistake."}},
    {t:"Duty of care",k:"주의의무",d:{ko:"재산을 투자하고 관리할 때, 남의 재산을 관리하는 신중한 사람(prudent person) 수준의 주의, 성실, 능력을 발휘해야 해요.",en:"When investing and managing the property, the trustee must use the care, diligence and skill of a prudent person managing someone else's property."},w:{ko:"각 주의 Trustee Act에 규정돼 있어요. 예를 들어 Trustee Act 1925 (NSW) s 14A예요. 전문 수탁자에게는 더 높은 기준이 적용돼요.",en:"Set out in state Trustee Acts, for example Trustee Act 1925 (NSW) s 14A. Professional trustees are held to a higher standard."}},
    {t:"Duty to consider",k:"재량 고려 의무",d:{ko:"수탁자에게 재량이 있으면, 행사할지와 어떻게 행사할지를 실질적이고 진지하게 고려(real and genuine consideration)해야 해요.",en:"Where a trustee has a discretion, they must give real and genuine consideration to whether and how to use it."},w:{ko:"법원은 결과 자체에는 잘 간섭하지 않지만, 악의, 적절한 고려 부재, 부당한 목적이 있으면 개입해요.",en:"Courts rarely second-guess the outcome, but will step in for bad faith, lack of proper consideration or an improper purpose."}},
    {t:"Duty of impartiality",k:"공평의무",d:{ko:"수탁자는 수익자들 사이에서 공평하게 행동해야 해요. 수익(income) 수익자와 원본(capital) 수익자 사이가 대표적이에요.",en:"The trustee must act even-handedly between beneficiaries, such as those entitled to income and those entitled to capital."},w:{ko:"지금 수익은 크지만 원본 성장은 적은 투자처럼, 한쪽에 유리한 투자를 할 때 문제가 돼요.",en:"It matters when an investment favours one group, like high income now but little capital growth."}},
    {t:"Duty to account",k:"회계 및 정보제공 의무",d:{ko:"수탁자는 회계 기록을 제대로 남기고, 신탁 운영 상황을 수익자에게 보여줄 준비가 돼 있어야 해요.",en:"The trustee must keep proper accounts and be ready to show beneficiaries how the trust is run."},w:{ko:"수익자는 신탁 서류 열람을 요청할 수 있어요. 다만 재량 결정의 이유 같은 일부 서류는 법원이 열람 범위를 정해요.",en:"Beneficiaries can ask to inspect trust documents. For some, such as reasons for discretionary decisions, the court controls access."}},
    {t:"Right of indemnity",k:"비용상환청구권",d:{ko:"수탁자는 적법하게 지출한 비용을 신탁재산에서 지급하거나 돌려받을 수 있어요.",en:"A trustee can pay properly incurred expenses out of the trust assets, or be reimbursed from them."},w:{ko:"신탁재산에 대한 형평법상 우선특권(equitable lien)이 뒷받침해요. 그래서 수탁자가 교체될 때 특히 중요해져요.",en:"It is backed by an equitable lien over the trust assets, which is why it matters so much when a trustee is replaced."}}
  ],
  law:[
    ["Keech v Sandford (1726) Sel Cas Ch 61",{ko:"수탁자의 엄격한 이익 취득 금지",en:"Strict rule against trustee profit"}],
    ["Boardman v Phipps [1967] 2 AC 46",{ko:"손해가 없어도 이익 반환",en:"Profit must be surrendered even without loss"}],
    ["Chan v Zacharia (1984) 154 CLR 178",{ko:"호주의 이해충돌 및 이익 규칙",en:"Australian statement of conflict and profit rules"}],
    ["Breen v Williams (1996) 186 CLR 71",{ko:"신인의무의 금지적 성격",en:"Fiduciary duties are proscriptive"}],
    ["Speight v Gaunt (1883) 9 App Cas 1",{ko:"신중한 사업가 기준",en:"Prudent person of business standard"}],
    ["Trustee Act 1925 (NSW) s 14A",{ko:"투자 시 주의의무",en:"Duty of care when investing"}],
    ["Karger v Paul [1984] VR 161",{ko:"재량 행사에 대한 법원 심사",en:"Court review of discretionary decisions"}],
    ["Schmidt v Rosewood Trust Ltd [2003] 2 AC 709",{ko:"수익자의 신탁 서류 열람",en:"Beneficiary access to trust documents"}],
    ["Naaman v Jaken Properties Australia Pty Ltd [2025] HCA 1",{ko:"수탁자 교체와 비용상환청구권",en:"Right of indemnity when trustees change"}]
  ],
  quiz:[
    {q:{ko:"데브 삼촌이 신탁 소유 바닷가 아파트를 시세대로 샀어요. 미아와 레오가 매매를 취소할 수 있을까요?",en:"Dev buys the trust's beach unit at full market price. Can Mia and Leo undo the sale?"},o:[{ko:"아니요, 가격이 공정했으니까요",en:"No, the price was fair"},{ko:"네, 적법한 허가가 없었다면 가격과 관계없이 자기거래는 취소할 수 있어요",en:"Yes, self-dealing can be set aside whatever the price, unless properly authorised"},{ko:"손해를 봤을 때만 가능해요",en:"Only if they lost money"},{ko:"로즈 할머니가 반대할 때만 가능해요",en:"Only if Rose objects"}],a:1,y:{ko:"자기거래 규칙은 엄격해요. 가격이 공정했다는 건 방어가 안 돼요. 이해충돌 자체가 문제이기 때문이에요.",en:"The self-dealing rule is strict. A fair price is no answer, because the conflict itself is the problem."}},
    {q:{ko:"데브 삼촌이 신탁자금 전부를 위험한 코인 하나에 넣었어요. 가장 관련 있는 의무는?",en:"Dev puts the whole fund into one risky crypto coin. Which duty is most in play?"},o:[{ko:"이익 취득 금지",en:"No-profit rule"},{ko:"주의의무(신중한 사람 기준)",en:"Duty of care (prudent person)"},{ko:"회계 의무",en:"Duty to account"},{ko:"비용상환청구권",en:"Right of indemnity"}],a:1,y:{ko:"투기성이 높은 자산 하나에 전부 넣는 것은 위험, 분산투자, 수익자의 필요를 고려하는 신중한 사람 기준을 충족하기 어려워요.",en:"Putting everything into one highly speculative asset is unlikely to meet the prudent person standard, which weighs risk, diversification and the beneficiaries' needs."}},
    {q:{ko:"수탁자로 일하다 좋은 투자 정보를 알게 된 데브 삼촌이 자기 돈으로 투자했어요. 신탁은 손해가 없어요. 이익을 가져도 될까요?",en:"While acting as trustee, Dev learns about a great investment and buys it for himself. The trust loses nothing. Can he keep the profit?"},o:[{ko:"네, 손해가 없으면 문제없어요",en:"Yes, no loss means no problem"},{ko:"아니요, 지위를 통해 얻은 이익은 반환해야 해요",en:"No, he must account for profit made through his position"},{ko:"정직하게 했다면 가져도 돼요",en:"Yes, if he acted honestly"},{ko:"절반만 가질 수 있어요",en:"He keeps half"}],a:1,y:{ko:"이익 취득 금지 규칙은 수탁자가 정직했고 신탁에 손해가 없어도 적용돼요. Boardman v Phipps 사건의 결론이에요.",en:"The no-profit rule applies even when the trustee is honest and the trust suffers no loss. That was the result in Boardman v Phipps."}},
    {q:{ko:"데브 삼촌에게는 미아와 레오 사이에 수익을 나눌 재량이 있어요. 동전을 던져 정했어요. 무엇이 문제일까요?",en:"Dev has a discretion to split income between Mia and Leo. He flips a coin. What's wrong?"},o:[{ko:"문제없어요. 재량이니까요",en:"Nothing, it's his discretion"},{ko:"결정에 실질적이고 진지한 고려를 하지 않았어요",en:"He failed to give real and genuine consideration"},{ko:"항상 반반 나눠야 해요",en:"He must always split it 50/50"},{ko:"로즈 할머니만 정할 수 있어요",en:"Only Rose can decide"}],a:1,y:{ko:"재량에도 제대로 고려할 의무가 따라요. 우연에 맡기면 수익자 사정을 실질적으로 고려하지 않은 거예요.",en:"A discretion still carries a duty to think. Leaving it to chance shows no real consideration of the beneficiaries' circumstances."}},
    {q:{ko:"데브 삼촌이 신탁 주식 등록 문제를 해결하려고 변호사에게 800달러를 냈어요. 최종적으로 누가 부담할까요?",en:"Dev pays a lawyer $800 to fix a problem with the trust's share registration. Who bears the cost in the end?"},o:[{ko:"데브 삼촌 개인",en:"Dev personally"},{ko:"비용상환청구권에 따라 신탁재산",en:"The trust assets, through the right of indemnity"},{ko:"로즈 할머니",en:"Nana Rose"},{ko:"미아와 레오 개인",en:"Mia and Leo personally"}],a:1,y:{ko:"신탁 운영을 위해 적법하게 지출한 비용은 신탁재산에서 부담해요. 이것이 수탁자의 비용상환청구권이에요.",en:"Expenses properly incurred in running the trust come out of the trust assets. That is the trustee's right of indemnity."}}
  ]
},
{
  icon:"branch",
  title:{ko:"법이 만드는 신탁",en:"Trusts the law makes"},
  sub:{ko:"복귀신탁과 의제신탁",en:"Resulting and constructive trusts"},
  story:[
    {w:"narr",ko:"레오가 19살이 됐어요. 차 값 3만 달러를 전부 냈지만, 친구 잭의 이름으로 샀어요. 잭의 보험료가 더 싸다는 이유였죠.",en:"Leo is 19 now. He pays the full $30,000 for a car but buys it in his mate Jack's name, because Jack's insurance is cheaper."},
    {w:"jack",ko:"서류에 내 이름이 있잖아. 이제 내 차지?",en:"My name's on the papers. Car's mine now, right?"},
    {w:"leo",ko:"너한테 주려던 게 아니었다고!",en:"I never meant to give it to you!"},
    {w:"narr",ko:"아무도 신탁증서를 쓰지 않았어요. 그래도 형평법은 레오에게 증여할 의도가 없었다고 추정해요. 이게 복귀신탁이에요.",en:"Nobody wrote a trust deed. Even so, equity presumes Leo didn't intend a gift. That's a resulting trust."},
    {w:"narr",ko:"한편 데브 삼촌은 신탁 정보를 이용해 몰래 5천 달러를 벌었어요. 법은 데브의 의도를 묻지 않아요. 그 돈은 미아와 레오를 위한 의제신탁으로 보유돼요.",en:"Meanwhile, Dev secretly made $5,000 using trust information. The law doesn't ask what Dev intended. That money is held on constructive trust for Mia and Leo."},
    {w:"mia",ko:"그러니까 어떤 신탁은 사람들이 아마 의도했을 것에서 생기고, 어떤 신탁은 재산을 가지는 게 비양심적이라서 법이 강제로 만드는 거네요?",en:"So some trusts come from what people probably meant, and others are imposed because keeping the property would be unconscionable?"},
    {w:"rose",ko:"바로 그거야.",en:"That's it exactly."}
  ],
  key:{ko:"명시신탁은 표현된 의도에서, 복귀신탁은 추정된 의도에서 생겨요. 의제신탁은 당사자의 의도와 관계없이 비양심적인 행동을 막기 위해 법이 부과해요.",en:"Express trusts come from stated intention. Resulting trusts come from presumed intention. Constructive trusts are imposed by law to prevent unconscionable conduct, whatever anyone intended."},
  compare:[
    {n:"cmpExpress",s:{ko:"표현된 의도",en:"Stated intention"},e:{ko:"로즈 할머니의 신탁",en:"Rose's trust for the kids"}},
    {n:"cmpResult",s:{ko:"추정된 의도",en:"Presumed intention"},e:{ko:"잭 명의로 산 레오의 차",en:"Leo's car in Jack's name"}},
    {n:"cmpCon",s:{ko:"법이 부과",en:"Imposed by law"},e:{ko:"데브 삼촌이 몰래 번 돈",en:"Dev's secret profit"}}
  ],
  cards:[
    {t:"Resulting trust",k:"복귀신탁",d:{ko:"재산이나 돈을 제공한 사람에게 수익권이 되돌아가는(result) 신탁이에요.",en:"A trust where the beneficial interest goes back (results) to the person who provided the property or money."},w:{ko:"주로 두 경우예요. 남의 명의로 재산을 사줬을 때, 또는 명시신탁이 실패하거나 재산이 남았을 때예요.",en:"Two main situations. Someone pays for property put in another's name, or an express trust fails or leaves a surplus."}},
    {t:"Purchase money resulting trust",k:"매수대금 복귀신탁",d:{ko:"A가 돈을 내고 B 명의로 재산을 사면, 형평법은 A에게 증여 의도가 없었다고 추정해요. B는 A를 위해 그 재산을 보유해요.",en:"If A pays for property put in B's name, equity presumes A didn't intend a gift. B holds it on trust for A."},w:{ko:"여러 사람이 다르게 기여했다면 각자 낸 금액 비율대로 지분이 정해질 수 있어요.",en:"Where people contribute unequally, the shares can follow what each paid."}},
    {t:"Presumption of advancement",k:"증여 추정",d:{ko:"특정 관계에서는 형평법이 반대로 증여를 추정해요. 부모가 자녀 명의로, 남편이 아내 명의로 재산을 사주는 경우예요.",en:"In certain relationships equity presumes a gift instead, such as a parent buying for a child or a husband for a wife."},w:{ko:"호주에서는 여전히 적용되지만 추정일 뿐이라서, 실제 의도에 관한 증거로 뒤집을 수 있어요.",en:"It still applies in Australia, but it is only a presumption. Evidence of actual intention can rebut it."}},
    {t:"Automatic resulting trust",k:"자동적 복귀신탁",d:{ko:"명시신탁이 실패하거나 재산이 다 쓰이지 않으면, 남은 재산은 설정자(또는 그 상속재산)에게 돌아가요.",en:"If an express trust fails or doesn't use up all the property, the leftover goes back to the settlor or their estate."},w:{ko:"목적을 다 이룬 기금에 돈이 남았을 때가 대표적이에요.",en:"A classic case is a fund for a purpose that has finished, with money left over."}},
    {t:"Constructive trust",k:"의제신탁",d:{ko:"법적 소유자가 재산을 자기 것으로 유지하는 게 비양심적일 때, 누구의 의도와도 관계없이 법이 부과하는 신탁이에요.",en:"A trust imposed by law, regardless of intention, where it would be unconscionable for the legal owner to keep the property."},w:{ko:"신인의무자가 얻은 이익, 사기로 얻은 재산, 무산된 공동사업(joint endeavour), 재산에 관한 일부 약속 위반에서 쓰여요.",en:"Fiduciary profits, property obtained by fraud, failed joint endeavours and some broken promises about property."}},
    {t:"Joint endeavour",k:"공동사업 의제신탁",d:{ko:"관계나 공동사업이 누구의 잘못 없이 끝났을 때, 한쪽이 상대방의 기여분까지 가지는 것은 비양심적일 수 있어요.",en:"When a relationship or joint venture ends without fault, it can be unconscionable for one party to keep the other's contributions."},w:{ko:"사실혼 관계나 가족 재산 분쟁에서 자주 쓰여요.",en:"Often used in disputes between de facto partners and family members."}}
  ],
  law:[
    ["Calverley v Green (1984) 155 CLR 242",{ko:"매수대금 복귀신탁과 기여 비율",en:"Purchase money resulting trust in proportion to contributions"}],
    ["Nelson v Nelson (1995) 184 CLR 538",{ko:"호주에서의 증여 추정",en:"Presumption of advancement in Australia"}],
    ["Muschinski v Dodds (1985) 160 CLR 583",{ko:"무산된 공동사업과 의제신탁",en:"Constructive trust after a failed joint endeavour"}],
    ["Baumgartner v Baumgartner (1987) 164 CLR 137",{ko:"사실혼 관계에서의 적용",en:"Applied to a de facto relationship"}],
    ["Giumelli v Giumelli (1999) 196 CLR 101",{ko:"의제신탁은 최후의 구제수단",en:"Constructive trust as a remedy of last resort"}]
  ],
  quiz:[
    {q:{ko:"레오가 차 값을 전액 내고 잭 명의로 샀어요. 다른 증거가 없다면 형평법상 소유자는?",en:"Leo paid the full price for the car bought in Jack's name. With no other evidence, who owns it in equity?"},o:[{ko:"잭",en:"Jack"},{ko:"레오",en:"Leo"},{ko:"둘이 반씩",en:"Both equally"},{ko:"아무도 아님",en:"Nobody"}],a:1,y:{ko:"형평법은 레오가 친구인 잭에게 증여할 의도가 없었다고 추정해요. 잭은 레오를 위해 차를 복귀신탁으로 보유해요.",en:"Equity presumes Leo didn't intend a gift to Jack, who is just a mate. Jack holds the car on resulting trust for Leo."}},
    {q:{ko:"아버지가 아파트를 사서 성인 딸 명의로 했어요. 형평법은 무엇을 추정할까요?",en:"A father buys a flat and puts it in his adult daughter's name. What does equity presume?"},o:[{ko:"아버지를 위한 복귀신탁",en:"A resulting trust for the father"},{ko:"딸에 대한 증여(증여 추정)",en:"A gift to the daughter (presumption of advancement)"},{ko:"의제신탁",en:"A constructive trust"},{ko:"아무것도 추정하지 않아요",en:"Nothing at all"}],a:1,y:{ko:"호주에서는 부모와 자녀 사이에 증여 추정이 적용돼요. 아버지는 증여 의도가 없었다는 증거로 이를 뒤집을 수 있어요.",en:"The presumption of advancement applies between parent and child in Australia. The father can rebut it with evidence he didn't intend a gift."}},
    {q:{ko:"로즈 할머니의 신탁은 미아와 레오의 대학 등록금 용도였어요. 둘 다 졸업했는데 1만 2천 달러가 남았고, 신탁증서엔 아무 말이 없어요. 보통 어디로 갈까요?",en:"Rose's trust was only for Mia and Leo's uni fees. Both graduate and $12,000 is left. The deed says nothing. Where does it usually go?"},o:[{ko:"데브 삼촌이 가져요",en:"Dev keeps it"},{ko:"복귀신탁으로 로즈 할머니나 그 상속재산에",en:"Back to Rose or her estate on resulting trust"},{ko:"정부로",en:"To the government"},{ko:"자선단체로",en:"To charity"}],a:1,y:{ko:"보통은 설정자에게 복귀해요. 다만 법원이 ‘등록금’을 단순한 증여 동기로 보고 미아와 레오에게 온전히 준 것으로 해석할 여지도 있어요.",en:"Usually it results back to the settlor. A court might instead read “uni fees” as just the motive for an outright gift to Mia and Leo."}},
    {q:{ko:"샘과 알렉스가 돈을 모아 함께 집을 샀어요. 누구의 잘못도 없이 헤어졌는데, 법적 소유자인 샘이 전부 가지려 해요. 법원은 무엇을 쓸 수 있을까요?",en:"Sam and Alex pool money to buy a house together. They split up with neither at fault. Sam, the legal owner, tries to keep it all. What might the court use?"},o:[{ko:"명시신탁",en:"An express trust"},{ko:"무산된 공동사업에 근거한 의제신탁",en:"A constructive trust based on a failed joint endeavour"},{ko:"증여 추정",en:"The presumption of advancement"},{ko:"쓸 수 있는 게 없어요",en:"Nothing"}],a:1,y:{ko:"Muschinski v Dodds와 Baumgartner 판결에 따르면, 공동사업이 누구 잘못 없이 끝났을 때 상대방 기여분을 가지는 것은 비양심적이에요.",en:"Muschinski v Dodds and Baumgartner hold that keeping the other's contributions after a joint endeavour fails without fault is unconscionable."}},
    {q:{ko:"복귀신탁과 의제신탁의 핵심 차이는?",en:"What's the key difference between a resulting and a constructive trust?"},o:[{ko:"복귀신탁은 서면이 필요해요",en:"Resulting trusts must be in writing"},{ko:"복귀신탁은 추정된 의도에, 의제신탁은 비양심성을 막으려는 법에 근거해요",en:"Resulting trusts rest on presumed intention, constructive trusts on law preventing unconscionability"},{ko:"의제신탁은 토지에만 적용돼요",en:"Constructive trusts only apply to land"},{ko:"차이가 없어요",en:"There's no difference"}],a:1,y:{ko:"복귀신탁은 재산 제공자가 아마 의도했을 바에 반응하고, 의제신탁은 누구의 의도와 관계없이 양심에 반응해요.",en:"Resulting trusts respond to what the provider probably intended. Constructive trusts respond to conscience, whatever anyone intended."}}
  ]
},
{
  icon:"scale",
  title:{ko:"신탁 위반과 구제",en:"Court day"},
  sub:{ko:"신탁 위반, 구제수단, 항변",en:"Breach of trust, remedies and defences"},
  story:[
    {w:"narr",ko:"모든 게 드러났어요. 데브 삼촌은 코인으로 4만 달러를 잃었고, 신탁자금 6만 달러로 보트를 샀어요. 친구 킴은 무슨 일인지 알면서 돈 옮기는 걸 도왔어요.",en:"It all comes out. Dev lost $40,000 on crypto and used $60,000 of trust money to buy a boat. His friend Kim helped move the money, knowing exactly what was going on."},
    {w:"judge",ko:"하나씩 봅시다. 수익자들은 무엇을 원하나요?",en:"Let's take this one step at a time. What do the beneficiaries want?"},
    {w:"mia",ko:"잃은 4만 달러를 채워 넣는 거요. 그리고 보트요. 지금 값이 더 올랐거든요.",en:"The lost $40,000 put back. And the boat, because it's worth more now."},
    {w:"leo",ko:"그리고 데브 삼촌을 수탁자에서 교체하고 싶어요.",en:"And we want Dev replaced as trustee."},
    {w:"dev",ko:"금융 인플루언서 말을 따랐을 뿐이에요! 저는 정직했다고요!",en:"I just followed a finance influencer! I was honest!"},
    {w:"judge",ko:"정직했을 수도 있죠. 합리적이었는지는 다른 문제예요.",en:"Honest, perhaps. Whether you were reasonable is another question."}
  ],
  key:{ko:"수익자는 수탁자에게 인적 청구(형평법상 보상, 이익반환)를 하거나, 추적(tracing)을 통해 재산 자체를 청구할 수 있어요. 사정을 알고 가담한 제3자도 책임질 수 있어요.",en:"Beneficiaries can bring personal claims against the trustee (equitable compensation or an account of profits) or claim the property itself by tracing. Third parties who knowingly take part can be liable too."},
  cards:[
    {t:"Breach of trust",k:"신탁 위반",d:{ko:"고의, 과실, 정직한 실수를 불문하고 수탁자가 의무를 이행하지 않은 모든 경우예요.",en:"Any failure by the trustee to carry out their duties, whether deliberate, careless or an honest mistake."},w:{ko:"수익자가 청구를 시작하는 출발점이에요.",en:"The starting point for any claim by the beneficiaries."}},
    {t:"Equitable compensation",k:"형평법상 보상",d:{ko:"신탁재산을 원래 있어야 할 상태로 회복시키기 위해 수탁자가 지급해야 하는 금전이에요.",en:"Money the trustee must pay to restore the trust fund to where it should be."},w:{ko:"코인으로 잃은 4만 달러 같은 손실에 쓰여요. 위반과 손실 사이에 인과관계가 필요해요.",en:"Used for losses like the $40,000 lost on crypto. There must be a causal link between the breach and the loss."}},
    {t:"Account of profits",k:"이익반환",d:{ko:"위반으로 얻은 이익을 전부 내놓아야 해요. 신탁이 손해를 보지 않았어도요.",en:"The trustee must hand over any profit made from the breach, even if the trust lost nothing."},w:{ko:"몰래 얻은 이익이나 허락받지 않은 이익에 쓰여요.",en:"Used for secret or unauthorised profits."}},
    {t:"Tracing",k:"추적",d:{ko:"신탁재산의 가치가 무엇으로 바뀌었는지 따라가는 절차예요. 보트를 사는 데 쓰인 돈이 그 예예요.",en:"A process for following trust value into whatever it was turned into, such as money used to buy a boat."},w:{ko:"수익자가 새 자산과 그 가치 상승분까지 청구할 수 있게 해줘요.",en:"It lets beneficiaries claim the new asset, including any rise in value."}},

  const t=D[S.lang];

  const node=(x,col,r,n,who)=>{
    const two=who.length>1, tx=two?x+82:x+64;
    const av=two?avatar(who[0],`x="${x+8}" y="57" width="40" height="40"`)+avatar(who[1],`x="${x+34}" y="57" width="40" height="40"`)
      :avatar(who[0],`x="${x+10}" y="55" width="44" height="44"`);
    return `<rect x="${x}" y="44" width="190" height="66" rx="14" fill="var(--surface)" stroke="${col}" stroke-width="2"/>${av}
    <text x="${tx}" y="73" font-weight="800" font-size="15" fill="${col}">${r}</text>
    <text x="${tx}" y="93" font-size="12.5" fill="var(--muted)">${n}</text>`;};
  const chip=(x,col,txt,dash)=>`<rect x="${x+25}" y="122" width="140" height="26" rx="13" fill="none" stroke="${col}" ${dash?'stroke-dasharray="4 4"':''}/>
    <text x="${x+95}" y="139.5" text-anchor="middle" font-size="12" font-weight="600" fill="${col}">${txt}</text>`;
  return `<svg viewBox="0 0 740 232" role="img" aria-label="${t.s}, ${t.t}, ${t.b}" font-family="Manrope,'Noto Sans KR',sans-serif">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--muted)"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--coral)"/></marker></defs>
    ${node(10,"var(--sand)",t.s,t.sn,["rose"])}${node(275,"var(--steel)",t.t,t.tn,["dev"])}${node(540,"var(--teal)",t.b,t.bn,["mia","leo"])}
    <line x1="204" y1="77" x2="269" y2="77" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="469" y1="77" x2="534" y2="77" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="237" y="30" text-anchor="middle" font-size="12.5" fill="var(--text)">${t.a1}</text>
    <text x="502" y="30" text-anchor="middle" font-size="12.5" fill="var(--text)">${t.a2}</text>
    ${chip(10,"var(--muted)",t.c0,true)}${chip(275,"var(--steel)",t.c1)}${chip(540,"var(--teal)",t.c2)}
    <path d="M635 152 C 610 214, 395 214, 372 156" fill="none" stroke="var(--coral)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah2)"/>
    <text x="502" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--coral)">${t.e}</text>
  </svg>`;
}

function head(){
  return `<header class="top"><div class="top-in">
    <div class="brand">${ic("scale")}<span>Trust Quest</span><small>${u("sub")}</small></div>
    <div class="spacer"></div>
    <div class="score">${u("score")} <b>${total()}/${totalQ}</b></div>
    <div class="seg" role="group" aria-label="Language">
${[["en","English"],["ko","한국어"],["zh","中文"]].map(([k,n])=>`<button data-lang="${k}" class="${S.lang===k?"on":""}" aria-pressed="${S.lang===k}">${n}</button>`).join("")}
    </div></div></header>`;
}

function nav(){
  const items=CH.map((c,i)=>`<button class="nav-item ${S.view==="ch"&&S.ch===i?"on":""}" data-ch="${i}">
    <span class="nav-num">${String(i+1).padStart(2,"0")}</span><span class="nav-t">${L(c.title)}</span>
    ${chDone(i)?`<span class="nav-s">${ic("check")}${chScore(i)}/${c.quiz.length}</span>`:""}</button>`).join("");
  return `<nav>${items}<div class="nav-res"><button class="nav-item ${S.view==="res"?"on":""}" data-res="1">
    <span class="nav-num">${ic("flag")}</span><span class="nav-t">${u("results")}</span></button></div></nav>`;
}

function storyView(c,i){
  const n=S.line[i]||1, lines=c.story.slice(0,n), role=roleOf;
  const who=[...new Set(c.story.map(l=>l.w).filter(w=>w!=="narr"))];
  const cast=`<div class="cast">${who.map(w=>{const p=CAST[w];return `<div class="cast-p" style="--c:${p.c}"><div class="av">${avatar(w)}</div><div><b>${L(p)}</b><span>${role(p)}</span></div></div>`}).join("")}</div>`;
  const html=lines.map((l,k)=>{const nw=k===n-1?"new":"";
    if(l.w==="narr") return `<div class="sys ${nw}">${ic("story")}<span>${L(l)}</span></div>`;
    const p=CAST[l.w], sd=p.side||"l";
    return `<div class="msg ${sd} ${nw}" style="--c:${p.c}"><div class="av">${avatar(l.w)}</div>
      <div class="bub"><div class="who">${L(p)}<span>${role(p)}</span></div>${L(l)}</div></div>`}).join("");
  const more=n<c.story.length;
  const replay=n>1?`<button class="btn ghost" data-act="replay">${ic("redo")}${u("replay")}</button>`:"";
  const ctrl=(more?`<button class="btn" data-act="line">${u("next")}${ic("arrow")}</button><button class="btn ghost" data-act="all">${u("all")}</button>`
    :`<button class="btn" data-tab="cards">${u("toCards")}${ic("arrow")}</button>`)+replay;
  const side=`<div class="key"><h4>${u("key")}</h4><p>${L(c.key)}</p></div>
    ${c.diagram?`<div class="diagram">${diagram()}</div>`:""}
    ${c.compare?`<div class="cmp">${c.compare.map(x=>`<div><b>${u(x.n)}</b><span class="src">${L(x.s)}</span><br><span class="eg">${L(x.e)}</span></div>`).join("")}</div>`:""}`;
  return `${cast}<div class="story"><div><div class="chatbox"><div class="chat">${html}</div></div><div class="ctrl">${ctrl}</div></div><div class="side">${more?"":side}</div></div>`;
}

function fmtAuth(x){
  let m=x.match(/^(.*? Act \d{4})(.*)$/); if(m) return `<i>${m[1]}</i>${m[2]}`;
  m=x.match(/^(.*?)( [\(\[]\d{4}[\)\]].*)$/); return m?`<i>${m[1]}</i>${m[2]}`:x;
}
function cardsView(c){
  const cards=c.cards.map((d,k)=>`<button class="card" data-card="${k}" data-step="0" aria-expanded="false">
    <div class="card-top"><b>${d.t}</b>${native(d)?`<span>${native(d)}</span>`:""}<span class="pips"><i></i><i></i></span></div>
    <p>${L(d.d)}</p><div class="when"><em>${u("when")}</em>${L(d.w)}</div></button>`).join("");
  const rows=c.law.map(l=>{const act=/ Act \d{4}/.test(l[0]);
    return `<tr><td><span class="tag" style="--c:${act?"var(--steel)":"var(--teal)"}">${act?u("isAct"):u("isCase")}</span></td><td>${fmtAuth(l[0])}</td><td>${L(l[1])}</td></tr>`}).join("");
  const law=`<details class="law"><summary>${u("law")}${ic("chev")}</summary><div class="tbl"><table>
    <thead><tr><th>${u("colType")}</th><th>${u("colAuth")}</th><th>${u("colPoint")}</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  return `<p class="hint">${u("tap")}</p><div class="cards">${cards}</div>${law}
    <div class="ctrl"><button class="btn" data-tab="quiz">${u("toQuiz")}${ic("arrow")}</button></div>`;
}

function quizView(c,i){
  const p=picks(i), qi=Math.min(S.qi[i]||0,c.quiz.length);
  const dots=c.quiz.map((q,k)=>{const cls=k===qi?"cur":(p[k]!==undefined?(p[k]===q.a?"ok":"no"):"");
    return k<=p.length?`<button class="dot ${cls}" data-jump="${k}" aria-label="${u("question")} ${k+1}"></button>`:`<span class="dot"></span>`}).join("");
  if(qi>=c.quiz.length && p.length===c.quiz.length){
    const sc=chScore(i), msg=sc===c.quiz.length?u("great"):sc>=c.quiz.length-2?u("good"):u("low");
    const nxt=i<CH.length-1?`<button class="btn" data-ch="${i+1}">${u("nextCh")}${ic("arrow")}</button>`:`<button class="btn coral" data-res="1">${u("results")}${ic("flag")}</button>`;
    return `<div class="dots">${dots}</div><div class="done"><div class="big">${sc}/${c.quiz.length}</div>
      <div><b>${u("thisCh")}</b><p>${msg}</p><div class="ctrl">${nxt}<button class="btn ghost" data-jump="0">${u("review")}</button><button class="btn ghost" data-act="retry">${ic("redo")}${u("retry")}</button></div></div></div>`;
  }
  const q=c.quiz[qi], chosen=p[qi], answered=chosen!==undefined;
  const opts=ORDER[i][qi].map((oi,pos)=>{
    let cls="";
    if(answered){cls=oi===q.a?"right":(oi===chosen?"wrong":"dim")}
    return `<button class="opt ${cls}" data-opt="${oi}" ${answered?"disabled":""}><span class="l">${"ABCD"[pos]}</span><span>${L(q.o[oi])}</span></button>`}).join("");
  const ok=chosen===q.a;
  const prev=qi>0?`<button class="btn ghost" data-jump="${qi-1}">${u("prev")}</button>`:"";
  const fb=(answered?`<div class="fb ${ok?"ok":"no"}"><b>${ok?u("right"):u("wrong")}</b>${L(q.y)}</div>`:"")+
    `<div class="ctrl">${prev}${answered?`<button class="btn" data-act="nextq">${qi===c.quiz.length-1?u("finish"):u("nextQ")}${ic("arrow")}</button>`:""}</div>`;
  return `<div class="quiz"><div><div class="dots">${dots}</div><p class="q">${L(q.q)}</p><div class="opts">${opts}</div>${fb}</div>
    <div class="qside">${u("question")}<div class="big">${qi+1}<span style="color:var(--muted);font-size:18px">/${c.quiz.length}</span></div>${u("thisCh")} <b class="mono" style="color:var(--text)">${chScore(i)}</b></div></div>`;
}

function chapterView(){
  const i=S.ch,c=CH[i];
  const tab=(k,icn)=>`<button class="tab ${S.tab===k?"on":""}" data-tab="${k}">${ic(icn)}${u(k)}</button>`;
  let body=S.tab==="story"?storyView(c,i):S.tab==="cards"?cardsView(c):quizView(c,i);
  return `<section class="panel"><div class="ch-head"><div class="num">${String(i+1).padStart(2,"0")}</div>
    <div><h2>${L(c.title)}</h2><p>${L(c.sub)}</p></div>
    <div class="tabs">${tab("story","story")}${tab("cards","cards")}${tab("quiz","quiz")}</div></div>${body}</section>`;
}

function resultsView(){
  const bars=CH.map((c,i)=>{const d=chDone(i),sc=chScore(i);
    return `<div class="bar"><span>${L(c.title)}</span><div class="track"><div class="fill" style="width:${d?sc/c.quiz.length*100:0}%"></div></div><span class="mono">${d?sc+"/"+c.quiz.length:"-"}</span></div>`}).join("");
  const all=CH.every((c,i)=>chDone(i));
  return `<section class="panel"><div class="ch-head"><div class="num">${total()}<span style="font-size:22px;color:var(--muted)">/${totalQ}</span></div>
    <div><h2>${u("resTitle")}</h2><p>${all?u("resSub"):u("notYet")}</p></div></div>
    <div class="res"><div><div class="bars">${bars}</div><div class="ctrl"><button class="btn ghost" data-act="reset">${ic("redo")}${u("restart")}</button></div></div>
    <div class="side"><div class="diagram">${diagram()}</div><div class="cmp">${CH[3].compare.map(x=>`<div><b>${u(x.n)}</b><span class="src">${L(x.s)}</span></div>`).join("")}</div></div></div></section>`;
}

const app=document.getElementById("app");
function render(){
  document.documentElement.lang=S.lang==="zh"?"zh-Hans":S.lang;
  app.innerHTML=head()+`<div class="wrap">${nav()}${S.view==="res"?resultsView():chapterView()}</div>`;
  save();
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset, i=S.ch;
  if(d.lang){S.lang=d.lang;render();return}
  if(d.res){S.view="res";render();window.scrollTo({top:0});return}
  if(d.ch!==undefined){S.view="ch";S.ch=+d.ch;S.tab="story";render();window.scrollTo({top:0});return}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.card!==undefined){const st=((+d.step||0)+1)%3;b.dataset.step=st;b.classList.toggle("s1",st===1);b.classList.toggle("s2",st===2);b.setAttribute("aria-expanded",st>0);return}
  if(d.jump!==undefined){S.qi[i]=+d.jump;render();return}
  if(d.opt!==undefined){const qi=S.qi[i]||0;const p=S.picks[i]||(S.picks[i]=[]);if(p[qi]===undefined){p[qi]=+d.opt;render()}return}
  switch(d.act){
    case "line":S.line[i]=(S.line[i]||1)+1;break;
    case "all":S.line[i]=CH[i].story.length;break;
    case "replay":S.line[i]=1;break;
    case "nextq":S.qi[i]=(S.qi[i]||0)+1;break;
    case "retry":S.picks[i]=[];S.qi[i]=0;ORDER[i]=CH[i].quiz.map(()=>shuffle([0,1,2,3]));break;
    case "reset":S.picks={};S.qi={};S.line={};S.ch=0;S.tab="story";S.view="ch";break;
    default:return;
  }
  render();
});
render();
</script>
</body>
</html>
